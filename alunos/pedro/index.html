<!DOCTYPE html>
<html>

<head>
    <title>Tabela de Horários</title>

    <style>

        body{
            font-family: Arial;
            text-align: center;
        }

        table{
            margin: auto;
        }

        th, td{
            padding: 10px;
        }

    </style>

</head>

<body>

    <h1>Atenção aos horários!!!</h1>

    <p>Tabela de Horários:</p>

    <table border="1">

        <tr>
            <th>Dia</th>
            <th>Horário</th>
        </tr>

        <tr>
            <td>Segunda-feira</td>
            <td>08:00 - 10:00</td>
        </tr>

        <tr>
            <td>Terça-feira</td>
            <td>10:00 - 12:00</td>
        </tr>

        <tr>
            <td>Quarta-feira</td>
            <td>14:00 - 16:00</td>
        </tr>

        <tr>
            <td>Quinta-feira</td>
            <td>16:00 - 18:00</td>
        </tr>

        <tr>
            <td>Sexta-feira</td>
            <td>08:00 - 10:00</td>
        </tr>

    </table>

    <p>Chocolate preferido: ao leite/ branco</p>


    <h1>Deus abençoe!!!</h1>

</body>

</html>
